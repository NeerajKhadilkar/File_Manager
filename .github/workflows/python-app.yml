name: Run UI.Vision TTM Pipeline & Commit CSV

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Chrome & Virtual Display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable unzip jq curl
          pip install pandas

      - name: Download and Unpack UI.Vision Chrome Extension
        run: |
          mkdir -p uivision-extension
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          EXT_URL="https://clients2.google.com/service/update2/crx?response=redirect&prodversion=${CHROME_VERSION}&acceptformat=crx2,crx3&x=id%3Deipoliejnbbljnemmnflodfcggagbhcm%26uc"
          
          echo "Downloading UI.Vision CRX..."
          curl -sSL "$EXT_URL" -o uivision.crx
          
          python3 -c "
          with open('uivision.crx', 'rb') as f:
              data = f.read()
          zip_idx = data.find(b'PK\x03\x04')
          if zip_idx != -1:
              with open('uivision.zip', 'wb') as f_out:
                  f_out.write(data[zip_idx:])
          "
          unzip -q uivision.zip -d ./uivision-extension
          echo "UI.Vision extension unpacked successfully."

      - name: Set Up Local CSV & UI.Vision HTML Runner
        run: |
          curl -sSL "https://raw.githubusercontent.com/A9T9/RPA/master/ui.vision.html" -o ui.vision.html

      - name: Create Pipeline Runner Script
        run: |
          cat << 'EOF' > run_pipeline.py
          import os
          import csv
          import json
          import subprocess
          import threading
          import time
          from http.server import HTTPServer, BaseHTTPRequestHandler

          CSV_FILE = "collated_morn_exchange_unprocessed_records_filtered.csv"
          SERVER_PORT = 9999
          CHROME_BIN = "/usr/bin/google-chrome"
          EXT_DIR = os.path.abspath("./uivision-extension")
          HTML_RUNNER = os.path.abspath("./ui.vision.html")

          if not os.path.exists(CSV_FILE):
              print(f"Warning: {CSV_FILE} not found. Creating placeholder.")
              with open(CSV_FILE, "w", newline="", encoding="utf-8") as f:
                  writer = csv.writer(f)
                  writer.writerow(["SecId","PerformanceId","ExchangeId","Ticker","Date","Inception_Date","Extracted_Title","Present_In","Players"])
                  writer.writerow(["F00001TAE8","0P0001YKZK","EX$$$$XNAS","PJSM","9/3/2026","9/3/2026","MarketWatch Fund","DB","marketwatch"])

          with open(CSV_FILE, newline="", encoding="utf-8") as f:
              rows = list(csv.reader(f))
          csv_json = json.dumps(rows).encode("utf-8")
          print(f"Server ready: Hosting {len(rows)} records for UI.Vision.")

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(csv_json)))
                  self.send_header('Access-Control-Allow-Origin', '*')
                  self.end_headers()
                  self.wfile.write(csv_json)
              def log_message(self, *a): pass

          server = HTTPServer(('127.0.0.1', SERVER_PORT), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()

          download_dir = os.path.expanduser("~/Downloads")
          os.makedirs(download_dir, exist_ok=True)
          user_data_dir = "/tmp/chrome_uivision_profile"

          run_url = f"file://{HTML_RUNNER}?direct=1&macro=us_etf_ttm_executor&closeRPA=0"

          chrome_flags = [
              CHROME_BIN,
              f"--load-extension={EXT_DIR}",
              f"--user-data-dir={user_data_dir}",
              "--no-sandbox",
              "--disable-dev-shm-usage",
              "--disable-gpu",
              "--window-size=1920,1080",
              run_url
          ]

          print("Launching Chrome under virtual display...")
          proc = subprocess.Popen(chrome_flags)

          max_timeout = 1800
          start_time = time.time()
          output_found = None

          while time.time() - start_time < max_timeout:
              candidates = [
                  os.path.join(download_dir, f) for f in os.listdir(download_dir)
                  if f.startswith("competitor_etf_report_") and f.endswith(".csv")
              ] + [
                  f for f in os.listdir(".")
                  if f.startswith("competitor_etf_report_") and f.endswith(".csv")
              ]

              if candidates:
                  output_found = candidates[0]
                  print(f"Generated CSV detected: {output_found}")
                  break
              time.sleep(10)

          proc.terminate()
          try:
              proc.wait(timeout=10)
          except Exception:
              proc.kill()

          if output_found and os.path.exists(output_found):
              target_dest = os.path.basename(output_found)
              if os.path.abspath(output_found) != os.path.abspath(target_dest):
                  import shutil
                  shutil.copyfile(output_found, target_dest)
              print(f"CSV successfully positioned at {target_dest}")
          else:
              print("Pipeline finished or timed out without generating output CSV.")
          EOF

