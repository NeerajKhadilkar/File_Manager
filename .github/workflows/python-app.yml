name: Run Selenium Scraper & Commit HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Grants write permission to push commits to the repository
permissions:
  contents: write

jobs:
  scrape:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium beautifulsoup4 certifi

    - name: Create Python Script File
      shell: powershell
      run: |
        @'
        from selenium import webdriver
        from selenium.webdriver.chrome.options import Options
        from selenium.webdriver.support.ui import WebDriverWait
        from bs4 import BeautifulSoup

        chrome_options = Options()
        chrome_options.add_argument('--headless=new')
        chrome_options.add_argument('--disable-blink-features=AutomationControlled')
        chrome_options.add_experimental_option("excludeSwitches", ["enable-automation"])
        chrome_options.add_experimental_option('useAutomationExtension', False)
        chrome_options.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')

        driver = webdriver.Chrome(options=chrome_options)
        driver.execute_cdp_cmd('Network.setUserAgentOverride', {
            "userAgent": 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
        })
        driver.execute_script("Object.defineProperty(navigator, 'webdriver', {get: () => undefined})")

        url = r"https://www.marketwatch.com/investing/fund/PJSM"
        driver.get(url)

        html = driver.page_source
        soup = BeautifulSoup(html, 'html.parser')
        driver.quit()

        # Save the HTML page locally
        local_filename = "scraped_output.html"
        with open(local_filename, "w", encoding="utf-8") as f:
            f.write(html)

        print("Scrape successful")
        print(f"Saved HTML to {local_filename}")
        '@ | Out-File -FilePath inline_script.py -Encoding utf8

    - name: Execute Scraper Script
      run: python inline_script.py

    - name: Commit and Push Scraped HTML to Repository
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add scraped_output.html
        
        # Check if there are changes before committing
        if git diff --staged --quiet; then
          echo "No changes detected in scraped_output.html. Skipping commit."
        else
          git commit -m "Auto-update scraped_output.html [skip ci]"
          git push origin HEAD
        fi

    - name: Upload HTML as workflow artifact (backup)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scraped-html
        path: scraped_output.html
