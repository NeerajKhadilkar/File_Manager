name: Run Non-Headless Selenium Scraper & Send SendGrid Email

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  scrape:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Added sendgrid package to the setup steps
        pip install selenium beautifulsoup4 sendgrid

    - name: Configure Virtual Desktop Resolution
      run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      shell: powershell

    - name: Create Python Script File
      shell: powershell
      run: |
        @'
        from selenium import webdriver
        from selenium.webdriver.chrome.options import Options
        from selenium.webdriver.chrome.service import Service
        from selenium.webdriver.support.ui import WebDriverWait
        from bs4 import BeautifulSoup
        import time
        from sendgrid import SendGridAPIClient
        from sendgrid.helpers.mail import Mail

        # --- 1. SELENIUM BROWSER SCRAPING ---
        chrome_options = Options()
        chrome_options.add_argument('--window-size=1920,1080')
        chrome_options.add_argument('--start-maximized')
        chrome_options.add_argument('--disable-gpu')
        chrome_options.add_argument('--disable-blink-features=AutomationControlled')
        chrome_options.add_experimental_option("excludeSwitches", ["enable-automation"])
        chrome_options.add_experimental_option('useAutomationExtension', False)
        chrome_options.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')

        driver = webdriver.Chrome(options=chrome_options)
        driver.execute_cdp_cmd('Network.setUserAgentOverride', {
            "userAgent": 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
        })
        driver.execute_script("Object.defineProperty(navigator, 'webdriver', {get: () => undefined})")

        url = r"https://www.marketwatch.com/investing/fund/PJSM"
        print("Opening browser to extract data...")
        driver.get(url)
        time.sleep(5) 

        html = driver.page_source
        driver.quit()

        soup = BeautifulSoup(html, 'html.parser')
        print("Browser scraping successful.")

        # --- 2. SENDGRID EMAIL NOTIFICATION ---
        def send_notification(sendgrid_key):  
            # Define target recipient group/string since 'emails' wasn't declared prior
            target_recipient = 'neeraj.khadilkar@morningstar.com'

            message = Mail(  
                from_email='neeraj.khadilkar@morningstar.com',  
                to_emails=target_recipient,  
                subject='Test Email From SendGrid',  
                html_content='<strong>Test Email From SendGrid. Scraper completed successfully.</strong>'  
            )  
          
            try:  
                sg = SendGridAPIClient(sendgrid_key)  
                response = sg.send(message)  
                print(f"Status Code: {response.status_code}")  
                print("email sent")  
            except Exception as e:  
                print(str(e))  
                print("couldn't sent email.")  

        # Executing email payload with your token string
        print("Initializing SendGrid notification dispatch...")
        send_notification('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')

        '@ | Out-File -FilePath inline_script.py -Encoding utf8

    - name: Execute Scraper Script
      run: python inline_script.py
