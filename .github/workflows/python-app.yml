name: Run Selenium Scraper & Email HTML via SendGrid

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scrape:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium beautifulsoup4 certifi sendgrid

    - name: Create Python Script File
      shell: powershell
      run: |
        @'
        from selenium import webdriver
        from selenium.webdriver.chrome.options import Options
        from selenium.webdriver.chrome.service import Service
        from selenium.webdriver.support.ui import WebDriverWait
        from bs4 import BeautifulSoup
        import time
        import os
        import base64
        from selenium.webdriver.common.keys import Keys
        from selenium.webdriver.support import expected_conditions as EC
        from selenium.webdriver.common.by import By
        from sendgrid import SendGridAPIClient
        from sendgrid.helpers.mail import Mail, Attachment, FileContent, FileName, FileType, Disposition

        chrome_options = Options()
        # proxy = "190.97.226.134:999"
        # chrome_options.add_argument(f'--proxy-server=http://{proxy}')

        # Add stealth arguments
        chrome_options.add_argument('--headless=new')  # headless browser approach
        chrome_options.add_argument('--disable-blink-features=AutomationControlled')
        chrome_options.add_experimental_option("excludeSwitches", ["enable-automation"])
        chrome_options.add_experimental_option('useAutomationExtension', False)

        # Add realistic user agent
        chrome_options.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')

        # Initialize driver
        driver = webdriver.Chrome(options=chrome_options)

        # Execute CDP commands to further avoid detection
        driver.execute_cdp_cmd('Network.setUserAgentOverride', {
            "userAgent": 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
        })
        driver.execute_script("Object.defineProperty(navigator, 'webdriver', {get: () => undefined})")

        wait = WebDriverWait(driver, 30)

        url = r"https://www.cefa.com/fund-selector/detail/VSLYX/"
        driver.get(url)

        html = driver.page_source
        soup = BeautifulSoup(html, 'html.parser')
        driver.quit()

        # Save the HTML page locally
        local_filename = "scraped_output.html"
        with open(local_filename, "w", encoding="utf-8") as f:
            f.write(html)

        print("successful")
        print(f"Saved HTML to {local_filename}")

        # --- SEND EMAIL WITH HTML FILE ATTACHED (SendGrid) ---
        def send_notification(sendgrid_key, emails, file_path):
            with open(file_path, "rb") as f:
                file_data = f.read()
            encoded_file = base64.b64encode(file_data).decode()

            attachment = Attachment(
                FileContent(encoded_file),
                FileName(os.path.basename(file_path)),
                FileType("text/html"),
                Disposition("attachment"),
            )

            message = Mail(
                from_email="neeraj.khadilkar@morningstar.com",
                to_emails=emails,
                subject="CEFA Fund Scrape Results",
                html_content="Attached is the scraped HTML page for VSLYX from CEFA.",
            )
            message.attachment = attachment

            try:
                sg = SendGridAPIClient(sendgrid_key)
                response = sg.send(message)
                print(response.status_code)
                print("email sent")
            except Exception as e:
                print(str(e))
                print("couldn't send email.")

        SENDGRID_API_KEY = os.environ.get("SENDGRID_API_KEY")
        RECIPIENT_EMAILS = ["neeraj.khadilkar@morningstar.com"]  # <-- update recipient list as needed

        if not SENDGRID_API_KEY:
            raise ValueError("CRITICAL ERROR: SENDGRID_API_KEY is empty! Please check your GitHub Repository Secrets.")

        send_notification(SENDGRID_API_KEY, RECIPIENT_EMAILS, local_filename)

        '@ | Out-File -FilePath inline_script.py -Encoding utf8

    - name: Execute Scraper Script
      env:
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      run: python inline_script.py

    - name: Upload HTML as workflow artifact (backup)
      uses: actions/upload-artifact@v4
      with:
        name: scraped-html
        path: scraped_output.html
