      - name: Execute UI.Vision Runner under Virtual Framebuffer
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python run_pipeline.py

      - name: Commit and Push Generated CSV to Master
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add competitor_etf_report_*.csv
          
          if git diff --staged --quiet; then
            echo "No new CSV file found to commit."
          else
            git commit -m "Auto-update competitor ETF extraction report [skip ci]"
            git push origin master
          fi

      - name: Upload Report as Workflow Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-etf-report
          path: competitor_etf_report_*.csv
          retention-days: 14
