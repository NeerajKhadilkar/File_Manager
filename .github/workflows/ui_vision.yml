name: UI Vision - us_etf_ttm_executor

on:
  workflow_dispatch:                 # manual run
  schedule:
    - cron: '0 3 * * *'              # 03:00 UTC daily – change if needed
  push:
    branches:
      - '**'                         # or put your real branch name here
    paths:
      - 'collated_morn_exchange_unprocessed_records_filtered.csv'
      - 'us_etf_ttm_executor.json'
      - '.github/workflows/us-etf-ttm-executor.yml'

jobs:
  sec-extract:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Do NOT force a ref unless you are 100% sure the branch exists on origin

      - name: Show current branch and files
        shell: pwsh
        run: |
          Write-Host "GITHUB_REF      = $env:GITHUB_REF"
          Write-Host "GITHUB_REF_NAME = $env:GITHUB_REF_NAME"
          Get-ChildItem -Force
          Write-Host "----- CSV / JSON files -----"
          Get-ChildItem -Recurse -Include *.csv,*.json | Select-Object FullName

      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path uivision\macros, uivision\datasources, uivision\logs, output | Out-Null

          if (Test-Path "us_etf_ttm_executor.json") {
            Copy-Item "us_etf_ttm_executor.json" "uivision\macros\"
          } else {
            Write-Error "us_etf_ttm_executor.json not found in repository root"
            exit 1
          }

          if (Test-Path "collated_morn_exchange_unprocessed_records_filtered.csv") {
            Copy-Item "collated_morn_exchange_unprocessed_records_filtered.csv" "uivision\datasources\"
          } else {
            Write-Error "collated_morn_exchange_unprocessed_records_filtered.csv not found"
            exit 1
          }

      - name: Create ui.vision.html launcher
        shell: pwsh
        run: |
          @"
          <!DOCTYPE html>
          <html>
          <head><title>UI.Vision Command Line Launcher</title></head>
          <body>
            <h1>UI.Vision Command Line API</h1>
            <p>This page is used to start macros via URL parameters.</p>
          </body>
          </html>
          "@ | Set-Content -Path "uivision\ui.vision.html" -Encoding UTF8

      - name: Locate Chrome / Edge
        id: browser
        shell: pwsh
        run: |
          $chrome = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          $edge = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($chrome) {
            Write-Host "Using Chrome: $chrome"
            echo "BROWSER=$chrome" >> $env:GITHUB_OUTPUT
          } elseif ($edge) {
            Write-Host "Using Edge: $edge"
            echo "BROWSER=$edge" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Neither Chrome nor Edge found"
            exit 1
          }

      - name: Launch browser with UI.Vision command-line URL (skeleton)
        shell: pwsh
        run: |
          $browser = "${{ steps.browser.outputs.BROWSER }}"
          $workspace = $env:GITHUB_WORKSPACE
          $html = "file:///$($workspace.Replace('\','/'))/uivision/ui.vision.html"
          $log  = "$workspace\uivision\logs\run.log"
          $url  = "${html}?direct=1&macro=us_etf_ttm_executor&closeRPA=1&closeBrowser=1&savelog=$($log.Replace('\','/'))"

          Write-Host "Starting: $browser"
          Write-Host "URL: $url"

          # Start browser (UI.Vision extension must already be present for a real run)
          $proc = Start-Process -FilePath $browser `
            -ArgumentList @(
              "--no-first-run",
              "--no-default-browser-check",
              "--disable-popup-blocking",
              "--user-data-dir=$env:TEMP\chrome-user-data-gha",
              $url
            ) -PassThru

          Write-Host "Browser PID: $($proc.Id)"

          # Wait up to 2 hours or until log shows completion
          $timeoutSec = 7200
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalSeconds -lt $timeoutSec) {
            if (Test-Path $log) {
              $content = Get-Content $log -Raw -ErrorAction SilentlyContinue
              if ($content -match "Status=OK|Status=Error|Macro completed") {
                Write-Host "Macro finished according to log"
                break
              }
            }
            Start-Sleep -Seconds 30
          }

          # Kill browser if still running
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          Get-Process chrome, msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Collect output
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "competitor_etf_report_*.csv" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "output\" -Force -ErrorAction SilentlyContinue
          if (Test-Path "uivision\logs") {
            Copy-Item "uivision\logs\*" "output\" -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem "output" -ErrorAction SilentlyContinue

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-vision-results-${{ github.run_id }}
          path: |
            output/
            uivision/logs/
          retention-days: 14
