      - name: Setup Windows Profile & Seed UI.Vision Storage
        shell: powershell
        run: |
          $profileDir = "$env:TEMP\chrome_uivision_profile"
          $datasourcesDir = "$profileDir\Default\uivision\datasources"
          $macrosDir = "$profileDir\Default\uivision\macros"

          New-Item -ItemType Directory -Force -Path $datasourcesDir
          New-Item -ItemType Directory -Force -Path $macrosDir

          Copy-Item -Path ".\collated_morn_exchange_unprocessed_records_filtered.csv" -Destination $datasourcesDir -Force
          Copy-Item -Path ".\us_etf_ttm_executor.json" -Destination $macrosDir -Force
          Write-Host "Profile storage seeded successfully."

      - name: Run UI.Vision Native Execution Script
        shell: powershell
        run: |
          @'
          import os
          import time
          import shutil
          import subprocess
          import sys

          # Standard Google Chrome binary on Windows GitHub Runners
          CHROME_BIN = r"C:\Program Files\Google\Chrome\Application\chrome.exe"
          if not os.path.exists(CHROME_BIN):
              CHROME_BIN = r"C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"

          EXT_DIR = os.path.abspath(r".\uivision-extension")
          HTML_RUNNER = os.path.abspath(r".\ui.vision.html")
          PROFILE_DIR = os.path.join(os.environ["TEMP"], "chrome_uivision_profile")
          DOWNLOAD_DIR = os.path.join(os.environ["USERPROFILE"], "Downloads")
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          # Auto-run UI.Vision macro
          run_url = f"file:///{HTML_RUNNER.replace(os.sep, '/')}?direct=1&macro=us_etf_ttm_executor&closeRPA=0"

          chrome_flags = [
              CHROME_BIN,
              f"--load-extension={EXT_DIR}",
              f"--user-data-dir={PROFILE_DIR}",
              "--no-first-run",
              "--no-default-browser-check",
              "--window-size=1920,1080",
              run_url
          ]

          print(f"Launching Chrome with UI.Vision: {run_url}")
          proc = subprocess.Popen(chrome_flags)

          timeout = 2400  # 40 mins max
          start = time.time()
          found = None

          while time.time() - start < timeout:
              candidates = []
              if os.path.exists(DOWNLOAD_DIR):
                  candidates += [os.path.join(DOWNLOAD_DIR, f) for f in os.listdir(DOWNLOAD_DIR) if f.startswith("competitor_etf_report_") and f.endswith(".csv")]

              prof_down = os.path.join(PROFILE_DIR, "Default", "Downloads")
              if os.path.exists(prof_down):
                  candidates += [os.path.join(prof_down, f) for f in os.listdir(prof_down) if f.startswith("competitor_etf_report_") and f.endswith(".csv")]

              candidates += [f for f in os.listdir(".") if f.startswith("competitor_etf_report_") and f.endswith(".csv")]

              if candidates:
                  found = candidates[0]
                  print(f"Detected UI.Vision generated report: {found}")
                  shutil.copyfile(found, "competitor-etf-report.csv")
                  print("Created competitor-etf-report.csv successfully.")
                  break

              time.sleep(10)

          proc.terminate()
          try:
              proc.wait(timeout=10)
          except Exception:
              proc.kill()

          if not found:
              print("ERROR: Macro execution did not produce an output file within timeout.")
              sys.exit(1)
          '@ | Out-File -FilePath run_uivision_win.py -Encoding utf8

          python run_uivision_win.py

      - name: Commit and Push competitor-etf-report.csv to Master
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f "competitor-etf-report.csv" ]; then
            echo "ERROR: competitor-etf-report.csv not found to commit."
            exit 1
          fi

          git add competitor-etf-report.csv
          if git diff --staged --quiet; then
            echo "No changes in competitor-etf-report.csv. Skipping commit."
          else
            git commit -m "Auto-update competitor-etf-report.csv from UI.Vision run [skip ci]"
            git push origin master
          fi

      - name: Upload Artifact (Backup)
        if: always()
