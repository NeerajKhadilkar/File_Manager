      - name: Seed Profile & Execute UI.Vision Macro
        shell: powershell
        run: |
          if (-not (Test-Path -Path ".\ui.vision.html")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/A9T9/RPA/master/ui.vision.html" -OutFile "ui.vision.html"
          }

          $profileDir = "$env:TEMP\chrome_uivision_profile"
          $datasourcesDir = "$profileDir\Default\uivision\datasources"
          $macrosDir = "$profileDir\Default\uivision\macros"
          New-Item -ItemType Directory -Force -Path $datasourcesDir
          New-Item -ItemType Directory -Force -Path $macrosDir

          if (Test-Path -Path ".\collated_morn_exchange_unprocessed_records_filtered.csv") {
            Copy-Item -Path ".\collated_morn_exchange_unprocessed_records_filtered.csv" -Destination $datasourcesDir -Force
