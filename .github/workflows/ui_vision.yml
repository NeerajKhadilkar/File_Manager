name: Run UI.Vision TTM Crawler

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          pip install selenium pandas


      - name: Check Chrome
        shell: powershell
        run: |
          $chrome = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"

          if (Test-Path $chrome) {
              Write-Host "Chrome found: $chrome"
          }
          else {
              Write-Host "Installing Google Chrome..."

              winget install Google.Chrome `
                --accept-package-agreements `
                --accept-source-agreements
          }


      - name: Debug Files
        shell: powershell
        run: |
          Write-Host "===== WORKSPACE ====="

          Get-ChildItem -Recurse | Select-Object FullName

          Write-Host "===== INPUT CSV ====="

          Get-ChildItem `
            -Filter "collated_morn_exchange_unprocessed_records_filtered.csv" `
            -Recurse

          Write-Host "===== MACRO JSON ====="

          Get-ChildItem `
            -Filter "us_etf_ttm_executor.json" `
            -Recurse


      - name: Run UI.Vision Automation
        shell: powershell
        run: |
          python run_crawler.py


      - name: Find Generated Reports
        if: always()
        shell: powershell
        run: |
          Write-Host "===== SEARCHING FOR REPORT ====="

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter "competitor_etf_report_*.csv"


      - name: Commit Generated Report
        if: success()
        shell: powershell
        run: |

          $reports = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter "competitor_etf_report_*.csv"

          if ($reports.Count -eq 0) {

              Write-Host "ERROR: No report generated."

              exit 1

          }

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          foreach ($report in $reports) {

              Write-Host "Adding: $($report.FullName)"

              git add $report.FullName

          }

          if (git diff --cached --quiet) {

              Write-Host "Nothing changed."

          }
          else {

              git commit `
                -m "Auto-update competitor ETF report [skip ci]"

              git push origin HEAD:master

          }


      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-etf-report
          path: "**/competitor_etf_report_*.csv"
          if-no-files-found: warn
