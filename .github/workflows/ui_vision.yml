name: UI Vision - us_etf_ttm_executor

on:
  workflow_dispatch:          # manual trigger
  schedule:
    - cron: '0 3 * * *'       # 03:00 UTC daily – change as needed
  push:
    branches:
      - collated_morn_exchange_unprocessed_records_filtered
    paths:
      - 'collated_morn_exchange_unprocessed_records_filtered.csv'
      - 'us_etf_ttm_executor.json'
      - '.github/workflows/us-etf-ttm-executor.yml'

jobs:
  run-ui-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 180      # long-running macro – increase if needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: collated_morn_exchange_unprocessed_records_filtered

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            xvfb \
            x11-utils \
            fonts-liberation \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libdrm2 \
            libgbm1 \
            libasound2

      - name: Prepare working directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/uivision/macros"
          mkdir -p "$GITHUB_WORKSPACE/uivision/datasources"
          mkdir -p "$GITHUB_WORKSPACE/uivision/logs"
          mkdir -p "$GITHUB_WORKSPACE/output"

          # Place the macro (you must have the JSON in the repo)
          if [ -f "us_etf_ttm_executor.json" ]; then
            cp us_etf_ttm_executor.json "$GITHUB_WORKSPACE/uivision/macros/"
          else
            echo "ERROR: us_etf_ttm_executor.json not found in repository root"
            exit 1
          fi

          # Place the CSV that the macro reads
          if [ -f "collated_morn_exchange_unprocessed_records_filtered.csv" ]; then
            cp collated_morn_exchange_unprocessed_records_filtered.csv "$GITHUB_WORKSPACE/uivision/datasources/"
          else
            echo "ERROR: collated_morn_exchange_unprocessed_records_filtered.csv not found"
            exit 1
          fi

      - name: Create minimal ui.vision.html launcher
        run: |
          cat > "$GITHUB_WORKSPACE/uivision/ui.vision.html" << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>UI.Vision Command Line Launcher</title></head>
          <body>
            <h1>UI.Vision Command Line API</h1>
            <p>This page is used to start macros via URL parameters.</p>
            <script>
              // The real UI.Vision extension intercepts this page when loaded with the correct parameters.
              console.log("UI.Vision launcher loaded. Macro should start via extension.");
            </script>
          </body>
          </html>
          EOF

      - name: Start Xvfb and run Chromium with UI.Vision attempt
        env:
          DISPLAY: :99
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 3

          # NOTE: Official Chrome Web Store extension cannot be easily installed
          # in CI. This is the closest possible command-line style launch.
          # In practice you will need a self-hosted runner with the extension
          # already installed, or a custom Docker image that contains it.

          CHROME_BIN=$(which chromium-browser || which chromium || which google-chrome)

          "$CHROME_BIN" \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --window-size=1920,1080 \
            --user-data-dir=/tmp/chrome-user-data \
            "file://$GITHUB_WORKSPACE/uivision/ui.vision.html?direct=1&macro=us_etf_ttm_executor&closeRPA=1&closeBrowser=1&savelog=$GITHUB_WORKSPACE/uivision/logs/run.log" \
            > "$GITHUB_WORKSPACE/uivision/logs/chrome.stdout.log" 2>&1 &

          CHROME_PID=$!
          echo "Chromium PID: $CHROME_PID"

          # Wait a long time for the macro (adjust according to your ticker count)
          # The real UI.Vision extension would write Status=OK / Status=Error to the log.
          TIMEOUT=7200   # 2 hours
          SECONDS=0
          while [ $SECONDS -lt $TIMEOUT ]; do
            if [ -f "$GITHUB_WORKSPACE/uivision/logs/run.log" ]; then
              if grep -q "Status=OK\|Status=Error\|Macro completed" "$GITHUB_WORKSPACE/uivision/logs/run.log"; then
                echo "Macro finished according to log"
                break
              fi
            fi
            sleep 30
          done

          # Kill Chromium if still running
          kill $CHROME_PID 2>/dev/null || true
          pkill -f chromium || true
          pkill -f chrome || true

      - name: Collect output CSVs and logs
        if: always()
        run: |
          echo "=== Looking for generated CSVs ==="
          find "$GITHUB_WORKSPACE" -name "competitor_etf_report_*.csv" -o -name "*.csv" | head -50

          # Copy any report CSVs that the macro may have written
          find "$GITHUB_WORKSPACE" -name "competitor_etf_report_*.csv" -exec cp {} "$GITHUB_WORKSPACE/output/" \; || true
          cp -r "$GITHUB_WORKSPACE/uivision/logs" "$GITHUB_WORKSPACE/output/" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-vision-results-${{ github.run_id }}
          path: |
            output/
            uivision/logs/
          retention-days: 14

      - name: Fail if no report was produced (optional)
        if: always()
        run: |
          if ! ls output/competitor_etf_report_*.csv 1> /dev/null 2>&1; then
            echo "WARNING: No competitor_etf_report_*.csv found. The UI.Vision extension almost certainly did not run."
            echo "This workflow is only a skeleton. For production use a self-hosted runner or re-implement with Playwright."
            # Uncomment the next line if you want the job to fail
            # exit 1
          fi
