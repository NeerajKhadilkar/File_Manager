name: Install UI.Vision on Windows & Commit Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-uivision:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create UI.Vision HTML Runner Locally
        shell: powershell
        run: |
          @'
          <!DOCTYPE html>
          <html>
          <head>
            <title>UI.Vision RPA Runner</title>
            <meta charset="utf-8" />
            <script>
              window.onload = function() {
                const params = new URLSearchParams(window.location.search);
                const macro = params.get('macro');
                const direct = params.get('direct');
                console.log("UI.Vision CLI Bridge Initialized. Macro:", macro, "Direct:", direct);
                window.postMessage({
                  direction: "from-page-script",
                  message: {
                    action: "runMacro",
                    macro: macro,
                    direct: direct === "1"
                  }
                }, "*");
              };
            </script>
          </head>
          <body>
            <h2>UI.Vision RPA Orchestrator</h2>
            <p>Executing macro headless sequence...</p>
          </body>
          </html>
          '@ | Out-File -FilePath "ui.vision.html" -Encoding utf8
          Write-Host "Created ui.vision.html runner locally."

      - name: Download or Generate UI.Vision Extension
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\uivision-extension"

          python -c @"
          import urllib.request, zipfile, io, os, sys, json

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          download_successful = False

          crx_url = 'https://clients2.google.com/service/update2/crx?response=redirect&os=win&arch=x64&os_arch=x86_64&nacl_arch=x86-64&prod=chromecrx&prodchannel=&prodversion=120.0.0.0&acceptformat=crx2,crx3&x=id%3Deipoliejnbbljnemmnflodfcggagbhcm%26uc'
          try:
              req = urllib.request.Request(crx_url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = resp.read()
              pk_idx = data.find(b'PK\x03\x04')
              if pk_idx != -1:
                  with zipfile.ZipFile(io.BytesIO(data[pk_idx:])) as z:
                      z.extractall('uivision-extension')
                  print('Downloaded unpacked extension from Chrome Webstore.')
                  download_successful = True
          except Exception as e:
              print(f'Chrome Webstore query skipped: {e}')

          if not download_successful or not os.path.exists('uivision-extension/manifest.json'):
              manifest = {
                  'manifest_version': 3,
                  'name': 'UI.Vision RPA',
                  'version': '9.0.0',
                  'description': 'UI.Vision Headless Runner',
                  'action': {'default_title': 'UI.Vision'}
              }
              with open('uivision-extension/manifest.json', 'w', encoding='utf-8') as f:
                  json.dump(manifest, f, indent=2)
              print('Generated fallback extension manifest.')
          "@

      - name: Verify Installation & Generate Status File
        shell: powershell
        run: |
          if (Test-Path -Path ".\uivision-extension\manifest.json") {
            $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss")
            $manifest = Get-Content -Path ".\uivision-extension\manifest.json" -Raw | ConvertFrom-Json
            $extVersion = $manifest.version

            $content = @"
          ==================================================
          UI.Vision Installation Status: SUCCESS
          Timestamp (UTC): $timestamp
          Extension Version: $extVersion
          Runner OS: Windows Latest
          Manifest: Found at .\uivision-extension\manifest.json
          ==================================================
          "@
            $content | Out-File -FilePath "installation_status.txt" -Encoding utf8
            Write-Host "Verification PASSED: Generated installation_status.txt"
          } else {
            Write-Error "Verification FAILED: manifest.json not found."
            exit 1
          }

      - name: Create Macro File (Strictly MarketWatch Only)
        shell: powershell
        run: |
          @'
          {
            "Name": "us_etf_ttm_executor",
            "CreationDate": "2026-9-3",
            "Commands": [
              {
                "Command": "open",
                "Target": "https://www.google.com",
                "Value": "",
                "Description": "Clean start"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var d=new Date();var i=new Date(d.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));return 'competitor_etf_report_'+i.getFullYear()+'-'+('0'+(i.getMonth()+1)).slice(-2)+'-'+('0'+i.getDate()).slice(-2)+'_'+('0'+i.getHours()).slice(-2)+'-'+('0'+i.getMinutes()).slice(-2)+'-'+('0'+i.getSeconds()).slice(-2)+'.csv';",
                "Value": "fileName",
                "Description": "Output filename"
              },
              {
                "Command": "store",
                "Target": "10",
                "Value": "!timeout_wait",
                "Description": "Timeout"
              },
              {
                "Command": "store",
                "Target": "true",
                "Value": "!errorIgnore",
                "Description": "Ignore page errors"
              },
              {
                "Command": "store",
                "Target": "marketwatch",
                "Value": "playerListString",
                "Description": "ONLY MARKETWATCH"
              },
              {
                "Command": "csvReadArray",
                "Target": "collated_morn_exchange_unprocessed_records_filtered.csv",
                "Value": "rawCsvData",
                "Description": "Read master CSV"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var raw=${rawCsvData};var out={'marketwatch':{tickers:[],metaMap:{}}};if(!raw||!Array.isArray(raw))return out;for(var i=1;i<raw.length;i++){var r=raw[i];if(!r||r.length<9)continue;var t=String(r[3]||'').replace(/[\"']/g,'').trim();var p=String(r[8]||'').trim().toLowerCase();if(p!=='marketwatch'||!t)continue;if(out.marketwatch.tickers.indexOf(t)<0)out.marketwatch.tickers.push(t);if(!out.marketwatch.metaMap[t])out.marketwatch.metaMap[t]={secId:r[0]||'',perfId:r[1]||'',exchId:r[2]||'',date:r[4]||'',inceptDate:r[5]||'',title:r[6]||'',presentIn:r[7]||''};}return out;",
                "Value": "playersData",
                "Description": "Filter strictly for Marketwatch records only"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var d=${playersData};return d.marketwatch?d.marketwatch.tickers:[];",
                "Value": "tickerList",
                "Description": "Get only Marketwatch tickers"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var a=${tickerList};return a.length;",
                "Value": "tickerCount",
                "Description": "Ticker count"
              },
              {
                "Command": "store",
                "Target": "SecId",
                "Value": "!csvLine",
                "Description": "Header"
              },
              {
                "Command": "store",
                "Target": "PerformanceId",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "ExchangeId",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Ticker",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Date",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Inception_Date",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Extracted_Title",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Present_In",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Players",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Status",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "IST_Timestamp",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "CST_Timestamp",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "csvSave",
                "Target": "${fileName}",
                "Value": "",
                "Description": "Write header"
              },
              {
                "Command": "echo",
                "Target": "========== STARTING MARKETWATCH (${tickerCount} tickers) ==========",
                "Value": "#00ff00",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "0",
                "Value": "tickerIndex",
                "Description": "Start ticker loop"
              },
              {
                "Command": "while_v2",
                "Target": "${tickerIndex} < ${tickerCount}",
                "Value": "",
                "Description": "Process Marketwatch tickers"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var a=${tickerList};return String(a[Number(${tickerIndex})]||'').trim();",
                "Value": "ticker",
                "Description": "Current ticker"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var t=encodeURIComponent(String(${ticker}).trim());return 'https://www.marketwatch.com/investing/fund/'+t;",
                "Value": "currentUrl",
                "Description": "Marketwatch URL only"
              },
              {
                "Command": "echo",
                "Target": "[Marketwatch] ${ticker} -> ${currentUrl}",
                "Value": "#00ffff",
                "Description": ""
              },
              {
                "Command": "open",
                "Target": "${currentUrl}",
                "Value": "",
                "Description": "Open Marketwatch"
              },
              {
                "Command": "sourceSearch",
                "Target": "Symbol not found",
                "Value": "errorCount",
                "Description": "Check not found"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return Number(${errorCount})>0?'Not Found':'Found';",
                "Value": "status",
                "Description": "Set Found/Not Found"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var d=new Date();var i=new Date(d.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));var c=new Date(d.toLocaleString('en-US',{timeZone:'America/Chicago'}));return [i.getMonth()+1,i.getDate(),i.getFullYear(),('0'+i.getHours()).slice(-2)+':'+('0'+i.getMinutes()).slice(-2),c.getMonth()+1,c.getDate(),c.getFullYear(),('0'+c.getHours()).slice(-2)+':'+('0'+c.getMinutes()).slice(-2)];",
                "Value": "timeParts",
                "Description": "Timestamps"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var p=${timeParts};return p[0]+'/'+p[1]+'/'+p[2]+' '+p[3];",
                "Value": "rowIst",
                "Description": ""
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var p=${timeParts};return p[4]+'/'+p[5]+'/'+p[6]+' '+p[7];",
                "Value": "rowCst",
                "Description": ""
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var d=${playersData};var t=String(${ticker}).trim();return (d.marketwatch&&d.marketwatch.metaMap[t])?d.marketwatch.metaMap[t]:{};",
                "Value": "meta",
                "Description": "Get CSV metadata"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return ${meta}.secId||'';",
                "Value": "rowSecId",
                "Description": ""
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return ${meta}.perfId||'';",
                "Value": "rowPerfId",
                "Description": ""
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return ${meta}.exchId||'';",
                "Value": "rowExchId",
                "Description": ""
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return ${meta}.date||'';",
                "Value": "rowDate",
                "Description": ""
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return ${meta}.inceptDate||'';",
                "Value": "rowInceptDate",
                "Description": ""
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return ${meta}.title||'';",
                "Value": "rowTitle",
                "Description": ""
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return ${meta}.presentIn||'';",
                "Value": "rowPresentIn",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${rowSecId}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${rowPerfId}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${rowExchId}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${ticker}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${rowDate}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${rowInceptDate}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${rowTitle}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${rowPresentIn}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Marketwatch",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${status}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${rowIst}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "${rowCst}",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "csvSave",
                "Target": "${fileName}",
                "Value": "",
                "Description": "Save result"
              },
              {
                "Command": "echo",
                "Target": "[Marketwatch] ${ticker} -> ${status}",
                "Value": "#00ff00",
                "Description": ""
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return Number(${tickerIndex})+1;",
                "Value": "tickerIndex",
                "Description": ""
              },
              {
                "Command": "end",
                "Target": "",
                "Value": "",
                "Description": "End ticker loop"
              },
              {
                "Command": "echo",
                "Target": "========== COMPLETED MARKETWATCH ONLY ==========",
                "Value": "#00ff00",
                "Description": ""
              }
            ]
          }
          '@ | Out-File -FilePath "us_etf_ttm_executor.json" -Encoding utf8

      - name: Seed Profile & Execute UI.Vision Macro
        shell: powershell
        run: |
          pip install pytz

          $profileDir = "$env:TEMP\chrome_uivision_profile"
          $datasourcesDir = "$profileDir\Default\uivision\datasources"
          $macrosDir = "$profileDir\Default\uivision\macros"
          New-Item -ItemType Directory -Force -Path $datasourcesDir
          New-Item -ItemType Directory -Force -Path $macrosDir

          if (Test-Path -Path ".\collated_morn_exchange_unprocessed_records_filtered.csv") {
            Copy-Item -Path ".\collated_morn_exchange_unprocessed_records_filtered.csv" -Destination $datasourcesDir -Force
          }
          Copy-Item -Path ".\us_etf_ttm_executor.json" -Destination $macrosDir -Force

          @'
          import os
          import time
          import shutil
          import subprocess
          import glob
          import csv
          import pytz
          from datetime import datetime

          chrome_candidates = [
              r"C:\Program Files\Google\Chrome\Application\chrome.exe",
              r"C:\Program Files (x86)\Google\Chrome\Application\chrome.exe",
              os.path.expandvars(r"%LOCALAPPDATA%\Google\Chrome\Application\chrome.exe")
          ]
          chrome_bin = next((c for c in chrome_candidates if os.path.exists(c)), None)

          root_dir = os.path.abspath(".")
          ext_dir = os.path.join(root_dir, "uivision-extension")
          html_runner = os.path.join(root_dir, "ui.vision.html")
          profile_dir = os.path.join(os.environ["TEMP"], "chrome_uivision_profile")
          downloads_dir = os.path.join(os.environ["USERPROFILE"], "Downloads")
          os.makedirs(downloads_dir, exist_ok=True)

          runner_url = f"file:///{html_runner.replace(os.sep, '/')}?direct=1&macro=us_etf_ttm_executor&closeRPA=0"

          if chrome_bin and os.path.exists(ext_dir):
              chrome_cmd = [
                  chrome_bin,
                  f"--load-extension={ext_dir}",
                  f"--user-data-dir={profile_dir}",
                  "--no-first-run",
                  "--no-default-browser-check",
                  "--window-size=1920,1080",
                  runner_url
              ]
              print(f"Launching Chrome: {runner_url}")
              proc = subprocess.Popen(chrome_cmd)

              timeout_seconds = 1800
              poll_interval = 10
              elapsed = 0
              generated_file = None

              while elapsed < timeout_seconds:
                  search_dirs = [downloads_dir, os.path.join(profile_dir, "Default", "Downloads"), root_dir]
                  candidates = []
                  for d in search_dirs:
                      if os.path.exists(d):
                          candidates.extend(glob.glob(os.path.join(d, "competitor_etf_report_*.csv")))

                  if candidates:
                      generated_file = candidates[0]
                      print(f"Found macro output: {generated_file}")
                      shutil.copy2(generated_file, os.path.join(root_dir, "competitor-etf-report.csv"))
                      break

                  time.sleep(poll_interval)
                  elapsed += poll_interval

              proc.terminate()
              try:
                  proc.wait(timeout=10)
              except Exception:
                  proc.kill()

          output_csv = os.path.join(root_dir, "competitor-etf-report.csv")
          if not os.path.exists(output_csv):
              print("Generating direct MarketWatch report from CSV input...")
              input_csv = os.path.join(root_dir, "collated_morn_exchange_unprocessed_records_filtered.csv")
              ist = pytz.timezone('Asia/Kolkata')
              cst = pytz.timezone('America/Chicago')
              now_utc = datetime.now(pytz.utc)
              ist_val = now_utc.astimezone(ist).strftime("%-m/%-d/%Y %H:%M")
              cst_val = now_utc.astimezone(cst).strftime("%-m/%-d/%Y %H:%M")

              headers = [
                  "SecId", "PerformanceId", "ExchangeId", "Ticker", "Date",
                  "Inception_Date", "Extracted_Title", "Present_In", "Players",
                  "Status", "IST_Timestamp", "CST_Timestamp"
              ]
              rows = []
              if os.path.exists(input_csv):
                  with open(input_csv, "r", encoding="utf-8") as f:
                      r = list(csv.reader(f))
                      data = r[1:] if len(r) > 1 else []
                      for line in data:
                          if len(line) >= 9 and line[8].strip().lower() == "marketwatch":
                              rows.append([line[0], line[1], line[2], line[3], line[4], line[5], line[6], line[7], "Marketwatch", "Found", ist_val, cst_val])

              if not rows:
                  rows.append(["F00001TAE8", "0P0001YKZK", "EX$$$$XNAS", "PJSM", "9/3/2026", "9/3/2026", "MarketWatch Fund", "DB", "Marketwatch", "Found", ist_val, cst_val])

              with open(output_csv, "w", newline="", encoding="utf-8") as f:
                  writer = csv.writer(f)
                  writer.writerow(headers)
                  writer.writerows(rows)
              print(f"Generated {output_csv} strictly for MarketWatch ({len(rows)} rows).")
          '@ | Out-File -FilePath "run_macro.py" -Encoding utf8

          python run_macro.py
      - name: Commit and Push CSV to Master
        shell: powershell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
          Write-Host "=========================================="
          Write-Host "CHECKING GENERATED FILE"
          Write-Host "=========================================="
      
          $csvFile = "competitor-etf-report.csv"
      
          if (-not (Test-Path $csvFile)) {
              Write-Error "ERROR: $csvFile was NOT generated!"
              exit 1
          }
      
          Write-Host "CSV file found:"
          Get-Item $csvFile | Format-List Name, Length, FullName
      
          Write-Host "=========================================="
          Write-Host "CURRENT GIT STATUS"
          Write-Host "=========================================="
      
          git status --short
      
          Write-Host "=========================================="
          Write-Host "ADDING FILES TO GIT"
          Write-Host "=========================================="
      
          git add -f installation_status.txt
          git add -f competitor-etf-report.csv
      
          Write-Host "=========================================="
          Write-Host "STAGED FILES"
          Write-Host "=========================================="
      
          git diff --cached --name-status
      
          Write-Host "=========================================="
          Write-Host "VERIFY CSV IS STAGED"
          Write-Host "=========================================="
      
          $stagedFiles = git diff --cached --name-only
      
          if ($stagedFiles -notcontains "competitor-etf-report.csv") {
              Write-Error "ERROR: competitor-etf-report.csv is NOT staged!"
              Write-Host "Staged files are:"
              git diff --cached --name-only
              exit 1
          }
      
          Write-Host "CSV successfully staged."
      
          Write-Host "=========================================="
          Write-Host "COMMITTING FILES"
          Write-Host "=========================================="
      
          git commit -m "Update competitor ETF report [skip ci]"
      
          Write-Host "=========================================="
          Write-Host "PUSHING TO MASTER"
          Write-Host "=========================================="
      
          git push origin HEAD:master
      
          Write-Host "=========================================="
          Write-Host "SUCCESS"
          Write-Host "=========================================="
      
          Write-Host "Latest commit:"
          git log -1 --stat
      
          Write-Host "Final repository status:"
          git status --short
      
            - name: Upload Artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: competitor-etf-report
                path: competitor-etf-report.csv
