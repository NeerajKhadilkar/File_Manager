name: Install UI.Vision on Windows & Commit Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: windows-latest
    steps:
      # 1) REQUIRED
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install UI.Vision / run macro / generate CSV here
      #    Must write competitor-etf-report.csv into the repo workspace
      - name: Generate competitor ETF report
        shell: powershell
        run: |
          # your UI.Vision / automation commands
          # e.g. produce competitor-etf-report.csv and installation_status.txt
          if (-not (Test-Path "competitor-etf-report.csv")) {
            Write-Error "CSV was not generated"
            exit 1
          }

      # 3) Commit only if there is a real change
      - name: Commit and Push CSV
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f installation_status.txt competitor-etf-report.csv

          git status --short
          git diff --cached --stat

          # No staged content change → exit cleanly (or fail if you prefer)
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit (file identical or not staged)."
            exit 0
          }

          git commit -m "Update competitor ETF report [skip ci]"

          $branch = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "main" }
          git push origin "HEAD:$branch"
          Write-Host "Pushed commit to $branch"

      # 4) Optional: keep artifact for debugging
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-etf-report
          path: competitor-etf-report.csv
          if-no-files-found: warn
