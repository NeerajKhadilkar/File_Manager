name: Run SQL Extract & Commit Excel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sql-extract:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        shell: powershell
        run: |
          pip install pyodbc pandas pytz openpyxl

      - name: Install ODBC Driver 17 for SQL Server
        shell: powershell
        run: |
          Write-Host "Downloading ODBC Driver 17 for SQL Server..."
          $url = "https://go.microsoft.com/fwlink/?linkid=2249006"
          $installer = "$env:TEMP\msodbcsql17.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "Installing ODBC Driver 17..."
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart IACCEPTMSODBCSQLLICENSETERMS=YES" -Wait
          Write-Host "ODBC Driver 17 installed successfully."

      - name: Verify ODBC Driver Installation
        shell: powershell
        run: |
          $drivers = Get-OdbcDriver -Name "*SQL Server*" -Platform "64-bit" | Select-Object -ExpandProperty Name
          if ($drivers) {
            Write-Host "Installed ODBC drivers: $drivers"
          } else {
            Write-Error "No SQL Server ODBC driver found. Aborting."
            exit 1
          }

      - name: Write Python Script
        shell: powershell
        run: |
          @'
          import pyodbc
          import pandas as pd
          import time
          import os
          from datetime import datetime
          import pytz

          ist = pytz.timezone("Asia/Kolkata")
          now_ist = datetime.now(ist)
          date_suffix = now_ist.strftime("%d_%m")

          # Use repo root as output path (OneDrive not available in CI)
          path = os.path.join(os.path.abspath("."), "output", date_suffix)
          os.makedirs(path, exist_ok=True)
          print(f"Output directory: {path}")

          def sql_connection(retries=5, delay=60):
              attempt = 0
              while attempt < retries:
                  try:
                      cnxn = pyodbc.connect(
                          Driver="ODBC Driver 17 for SQL Server",
                          Server="dcprdreportdb.dcc8fc7.eas.morningstar.com,1433",
                          DATABASE="master",
                          UID="DataReader",
                          PWD="Read4Equity",
                          TrustServerCertificate="yes",
                      )
                      print(f"Connected on attempt {attempt + 1}")
                      return cnxn
                  except pyodbc.Error as e:
                      attempt += 1
                      print(f"Connection attempt {attempt} failed: {e}")
                      if attempt < retries:
                          print(f"Retrying in {delay}s...")
                          time.sleep(delay)
              raise ConnectionError(f"Failed to connect after {retries} attempts.")

          SQL_QUERY = """
          SELECT DISTINCT
              b.SecId,
              b.FundId,
              d.PerformanceId,
              a.ExchangeId,
              b.Name,
              b.EffectiveDate,
              b.InceptionDate AS Inception_Date,
              a.Identifier AS ContractID,
              b.LegalName,
              b.Status,
              b.PendingType,
              c.Universe,
              b.LastUpdate,
              a.IdentifierType
          FROM CurrentData.dbo.FundClassBasic b
          INNER JOIN SecurityData.dbo.SecuritySearch c
              ON b.SecId = c.SecId
          LEFT JOIN CurrentData.dbo.PerformanceBasic d
              ON d.InvestmentId = b.SecId
          INNER JOIN CurrentData.dbo.InvestmentIdentifier a
              ON b.SecId = a.InvestmentId
          WHERE c.CountryId = 'USA'
          AND c.Status = '2'
          AND b.PendingType = 3
          AND a.IdentifierType = 20
          AND c.Universe IN ('/OEIC/', '/OEIC/MM/')
          ORDER BY b.InceptionDate DESC;
          """

          print("\n=== Connecting to SQL Server ===")
          cnxn = sql_connection()

          print("=== Running SQL Query ===")
          df = pd.read_sql(SQL_QUERY, cnxn)
          cnxn.close()

          df.rename(columns={"ContractID": "CIK"}, inplace=True)
          print(f"Rows fetched: {len(df)}")
          print(f"Columns: {df.columns.tolist()}")

          out_file = os.path.join(path, f"sql_all_records_{date_suffix}.xlsx")
          df.to_excel(out_file, index=False)
          print(f"\nSaved: {out_file}")
          '@ | Out-File -FilePath "run_sql_extract.py" -Encoding utf8

      - name: Run SQL Extract Script
        shell: powershell
        run: |
          python run_sql_extract.py

      - name: List Generated Files
        shell: powershell
        run: |
          Write-Host "Generated output files:"
          Get-ChildItem -Path ".\output" -Recurse -Filter "*.xlsx" | Select-Object FullName, Length

      - name: Commit and Push Excel Output
        shell: powershell
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false

          git fetch origin master
          git checkout master

          # Stage all xlsx files under output/
          $files = Get-ChildItem -Path ".\output" -Recurse -Filter "*.xlsx" | Select-Object -ExpandProperty FullName
          if (-not $files) {
            Write-Host "No Excel files found to commit."
            exit 0
          }

          foreach ($f in $files) {
            git add -f $f
            Write-Host "Staged: $f"
          }

          $status = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host "No changes detected. Nothing to commit."
          } else {
            Write-Host "Committing changes..."
            git commit -m "Auto-update SQL extract output [skip ci]"
            git push origin master
            Write-Host "Pushed to master."
          }

      - name: Upload Artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-extract-output
          path: output/**/*.xlsx
          if-no-files-found: warn
