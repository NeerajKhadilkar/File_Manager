name: Run ETF Scraper & Commit CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests beautifulsoup4 pytz

      - name: Execute Scraper & Write competitor-etf-report.csv
        run: |
          python3 - << 'EOF'
          import os
          import csv
          import requests
          from datetime import datetime
          import pytz

          INPUT_CSV = "collated_morn_exchange_unprocessed_records_filtered.csv"
          OUTPUT_FILE = "competitor-etf-report.csv"

          # 1. Compute formatted timestamps
          ist = pytz.timezone('Asia/Kolkata')
          cst = pytz.timezone('America/Chicago')
          now_utc = datetime.now(pytz.utc)
          now_ist = now_utc.astimezone(ist)
          now_cst = now_utc.astimezone(cst)

          ist_val = now_ist.strftime("%-m/%-d/%Y %H:%M")
          cst_val = now_cst.strftime("%-m/%-d/%Y %H:%M")

          headers = [
              "SecId", "PerformanceId", "ExchangeId", "Ticker", "Date",
              "Inception_Date", "Extracted_Title", "Present_In", "Players",
              "Status", "IST_Timestamp", "CST_Timestamp"
          ]

          # 2. Read input file or initialize baseline
          if not os.path.exists(INPUT_CSV):
              print(f"Warning: {INPUT_CSV} not found on runner. Using sample baseline.")
              records = [["F00001TAE8", "0P0001YKZK", "EX$$$$XNAS", "PJSM", "9/3/2026", "9/3/2026", "MarketWatch Fund", "DB", "marketwatch"]]
          else:
              with open(INPUT_CSV, "r", encoding="utf-8") as f:
                  reader = list(csv.reader(f))
                  records = reader[1:] if len(reader) > 1 else []

          def check_marketwatch(ticker):
              url = f"https://www.marketwatch.com/investing/fund/{ticker}"
              headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
              try:
                  res = requests.get(url, headers=headers, timeout=10)
                  text_lower = res.text.lower()
                  url_lower = res.url.lower()
                  if "/search" in url_lower or "search results" in text_lower or "symbol not found" in text_lower:
                      return "Not Found"
                  return "Found"
              except Exception:
                  return "Found"

          display_map = {
              'wsj': 'wsj',
              'barrons': 'Barrons',
              'bloomberg': 'Bloomberg',
              'etf': 'ETF',
              'etfdb': 'ETFDB',
              'marketwatch': 'Marketwatch'
          }

          results = []
          for r in records:
              if len(r) < 9:
                  continue
              sec_id, perf_id, exch_id, ticker, date_val, incept_date, title, present_in, player = r[:9]
              player_clean = player.strip().lower()

              status = "Found"
              if player_clean == "marketwatch":
                  status = check_marketwatch(ticker)

              display_player = display_map.get(player_clean, player)

              results.append([
                  sec_id, perf_id, exch_id, ticker, date_val, incept_date,
                  title, present_in, display_player, status, ist_val, cst_val
              ])

          with open(OUTPUT_FILE, "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              writer.writerow(headers)
              writer.writerows(results)

          print(f"Generated {OUTPUT_FILE} with {len(results)} rows.")
          EOF

      - name: Commit and Push CSV to Master
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add competitor-etf-report.csv
          if git diff --staged --quiet; then
            echo "No changes detected in competitor-etf-report.csv. Skipping commit."
          else
            git commit -m "Auto-update competitor-etf-report.csv [skip ci]"
            git push origin master
          fi

      - name: Upload Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-etf-report
          path: competitor-etf-report.csv
