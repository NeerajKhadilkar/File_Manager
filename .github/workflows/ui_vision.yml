name: Run UI.Vision TTM Crawler & Commit CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable curl
          pip install selenium webdriver-manager pandas

      - name: Download UI.Vision HTML Runner (if missing)
        run: |
          if [ ! -f "./ui.vision.html" ]; then
            curl -sSL "https://raw.githubusercontent.com/A9T9/RPA/master/ui.vision.html" -o ui.vision.html
          fi

      - name: Execute Crawler via Virtual Display
        run: |
          cat << 'EOF' > run_crawler.py
          import os
          import sys
          import time
          import json
          import shutil
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager

          EXT_PATH = os.path.abspath("./uivision-extension")
          HTML_RUNNER = os.path.abspath("./ui.vision.html")
          INPUT_CSV = os.path.abspath("collated_morn_exchange_unprocessed_records_filtered.csv")
          MACRO_JSON = os.path.abspath("us_etf_ttm_executor.json")
          DOWNLOAD_DIR = os.path.abspath("./downloads")
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          if not os.path.exists(INPUT_CSV):
              print(f"ERROR: Missing {INPUT_CSV}")
              sys.exit(1)

          if not os.path.exists(MACRO_JSON):
              print(f"ERROR: Missing {MACRO_JSON}")
              sys.exit(1)

          # Configure Chrome options to run with unpacked extension
          chrome_options = Options()
          chrome_options.add_argument(f"--load-extension={EXT_PATH}")
          chrome_options.add_argument("--no-sandbox")
          chrome_options.add_argument("--disable-dev-shm-usage")
          chrome_options.add_argument("--disable-gpu")
          chrome_options.add_argument("--window-size=1920,1080")

          prefs = {
              "download.default_directory": DOWNLOAD_DIR,
              "download.prompt_for_download": False,
              "download.directory_upgrade": True,
              "safebrowsing.enabled": True
          }
          chrome_options.add_experimental_option("prefs", prefs)

          print("Starting Chrome Driver with UI.Vision...")
          driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=chrome_options)

          # Step 1: Open runner
          runner_url = f"file://{HTML_RUNNER}?direct=1&macro=us_etf_ttm_executor&closeRPA=0"
          driver.get(runner_url)
          print(f"Opened UI.Vision runner: {runner_url}")

          # Step 2: Poll for generated CSV in Downloads or repository directory
          timeout_sec = 2400
          poll_interval = 10
          elapsed = 0
          found_file = None

          print("Waiting for competitor_etf_report_*.csv to generate...")
          while elapsed < timeout_sec:
              # Check download directory
              candidates = [
                  os.path.join(DOWNLOAD_DIR, f) for f in os.listdir(DOWNLOAD_DIR)
                  if f.startswith("competitor_etf_report_") and f.endswith(".csv")
              ]
              # Also check repo root
              candidates += [
                  f for f in os.listdir(".")
                  if f.startswith("competitor_etf_report_") and f.endswith(".csv")
              ]

              if candidates:
                  found_file = candidates[0]
                  print(f"Successfully generated CSV: {found_file}")
                  # Copy to root if it is in downloads
                  dest = os.path.basename(found_file)
                  if os.path.abspath(found_file) != os.path.abspath(dest):
                      shutil.copyfile(found_file, dest)
                  break

              time.sleep(poll_interval)
              elapsed += poll_interval

          driver.quit()

          if not found_file:
              print("WARNING: Timeout reached without CSV being generated.")
          EOF

          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python run_crawler.py

      - name: Commit and Push Generated Report CSV to Master
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Find any matching generated CSV files
          REPORT_FILES=$(ls competitor_etf_report_*.csv 2>/dev/null || true)
          
          if [ -z "$REPORT_FILES" ]; then
            echo "No report file matching 'competitor_etf_report_*.csv' found to commit."
          else
            echo "Staging files: $REPORT_FILES"
            git add $REPORT_FILES
            if git diff --staged --quiet; then
              echo "No diff detected. Nothing to commit."
            else
              git commit -m "Auto-update competitor ETF extraction report [skip ci]"
              git push origin master
            fi
          fi

      - name: Upload Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-etf-report
          path: competitor_etf_report_*.csv
