name: Install UI.Vision on Windows & Commit Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-uivision:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download UI.Vision HTML Runner & Build Extension
        shell: powershell
        run: |
          # 1. Download official ui.vision.html command-line runner
          Write-Host "Downloading ui.vision.html..."
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/A9T9/RPA/master/ui.vision.html" -OutFile "ui.vision.html"

          # 2. Clone and build UI.Vision extension from source
          Write-Host "Cloning UI.Vision open-source repository..."
          git clone --depth 1 https://github.com/A9T9/RPA.git uivision-repo
          
          Set-Location -Path "uivision-repo"
          Write-Host "Installing dependencies..."
          npm install --force
          
          Write-Host "Building UI.Vision extension dist..."
          npm run build
          Set-Location -Path ".."

          # 3. Move unpacked build into .\uivision-extension
          Copy-Item -Path ".\uivision-repo\dist" -Destination ".\uivision-extension" -Recurse -Force
          Remove-Item -Path ".\uivision-repo" -Recurse -Force
          Write-Host "UI.Vision successfully installed at: .\uivision-extension"

      - name: Verify Installation & Generate Status File
        shell: powershell
        run: |
          if (Test-Path -Path ".\uivision-extension\manifest.json") {
            $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $content = @"
          ==================================================
          UI.Vision Installation Status: SUCCESS
          Timestamp (UTC): $timestamp
          Runner: Windows Latest
          Artifact: uivision-extension and ui.vision.html built
          ==================================================
          "@
            $content | Out-File -FilePath "installation_status.txt" -Encoding utf8
            Write-Host "Verification PASSED: Generated installation_status.txt"
          } else {
            Write-Error "Verification FAILED: Extension not built properly."
            exit 1
          }

      - name: Commit and Push Status TXT to Master
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add installation_status.txt
          if git diff --staged --quiet; then
            echo "No changes detected in installation_status.txt. Skipping commit."
          else
            git commit -m "Add UI.Vision installation success report [skip ci]"
            git push origin master
          fi
