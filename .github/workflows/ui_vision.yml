name: Run UI.Vision TTM Crawler & Commit CSV

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Chrome & Virtual Display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable
          pip install pandas

      - name: Verify Extension & Runner Files Exist
        run: |
          if [ ! -d "./uivision-extension" ]; then
            echo "Error: uivision-extension directory not found in repository root!"
            exit 1
          fi
          if [ ! -f "./ui.vision.html" ]; then
            echo "Downloading ui.vision.html..."
            curl -sSL "https://raw.githubusercontent.com/A9T9/RPA/master/ui.vision.html" -o ui.vision.html
          fi

      - name: Run Python Bridge & Browser under Virtual Display
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python run_pipeline.py

      - name: Commit and Push Generated Report CSV to Master
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add competitor_etf_report_*.csv
          
          if git diff --staged --quiet; then
            echo "No new report file generated to commit."
          else
            git commit -m "Auto-update competitor ETF extraction report [skip ci]"
            git push origin master
          fi

      - name: Upload Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-etf-report
          path: competitor_etf_report_*.csv
