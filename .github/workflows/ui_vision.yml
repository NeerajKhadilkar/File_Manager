name: Execute UI.Vision JSON Macro & Commit CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-uivision:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Verify Required Files & Download HTML Runner
        shell: powershell
        run: |
          # 1. Ensure uivision-extension directory exists
          if (-not (Test-Path -Path ".\uivision-extension")) {
            Write-Error "ERROR: 'uivision-extension' folder missing from repository root! Please commit it to master."
            exit 1
          }

          # 2. Download ui.vision.html runner if missing
          if (-not (Test-Path -Path ".\ui.vision.html")) {
            Write-Host "Fetching ui.vision.html runner..."
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/A9T9/RPA/master/ui.vision.html" -OutFile "ui.vision.html"
          }

          # 3. Verify input CSV exists
          if (-not (Test-Path -Path ".\collated_morn_exchange_unprocessed_records_filtered.csv")) {
            Write-Error "ERROR: collated_morn_exchange_unprocessed_records_filtered.csv not found in root!"
            exit 1
          }

      - name: Create UI.Vision Macro JSON File
        shell: powershell
        run: |
          @'
          {
            "Name": "us_etf_ttm_executor",
            "CreationDate": "2026-9-3",
            "Commands": [
              {
                "Command": "open",
                "Target": "https://www.google.com",
                "Value": "",
                "Description": "Clean start"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var d=new Date();var i=new Date(d.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));return 'competitor_etf_report_'+i.getFullYear()+'-'+('0'+(i.getMonth()+1)).slice(-2)+'-'+('0'+i.getDate()).slice(-2)+'_'+('0'+i.getHours()).slice(-2)+'-'+('0'+i.getMinutes()).slice(-2)+'-'+('0'+i.getSeconds()).slice(-2)+'.csv';",
                "Value": "fileName",
                "Description": "Output filename"
              },
              {
                "Command": "store",
                "Target": "10",
                "Value": "!timeout_wait",
                "Description": "Timeout"
              },
              {
                "Command": "store",
                "Target": "true",
                "Value": "!errorIgnore",
                "Description": "Ignore page errors"
              },
              {
                "Command": "store",
                "Target": "wsj,Barrons,Bloomberg,ETF,ETFDB,Marketwatch",
                "Value": "playerListString",
                "Description": "SELECT PLAYERS HERE"
              },
              {
                "Command": "csvReadArray",
                "Target": "collated_morn_exchange_unprocessed_records_filtered.csv",
                "Value": "rawCsvData",
                "Description": "Read master CSV"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var raw=${rawCsvData};var out={};if(!raw||!Array.isArray(raw))return out;for(var i=1;i<raw.length;i++){var r=raw[i];if(!r||r.length<9)continue;var t=String(r[3]||'').replace(/[\"']/g,'').trim();var p=String(r[8]||'').trim().toLowerCase();if(!t||!p)continue;if(!out[p])out[p]={tickers:[],metaMap:{}};if(out[p].tickers.indexOf(t)<0)out[p].tickers.push(t);if(!out[p].metaMap[t])out[p].metaMap[t]={secId:r[0]||'',perfId:r[1]||'',exchId:r[2]||'',date:r[4]||'',inceptDate:r[5]||'',title:r[6]||'',presentIn:r[7]||''};}return out;",
                "Value": "playersData",
                "Description": "Build player -> tickers + metadata"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "return String(${playerListString}).split(',').map(function(x){return x.trim().toLowerCase();}).filter(Boolean);",
                "Value": "playerList",
                "Description": "Selected players"
              },
              {
                "Command": "executeScript_Sandbox",
                "Target": "var p=${playerList};return p.length;",
                "Value": "playerCount",
                "Description": "Player count"
              },
              {
                "Command": "store",
                "Target": "SecId",
                "Value": "!csvLine",
                "Description": "Header"
              },
              {
                "Command": "store",
                "Target": "PerformanceId",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "ExchangeId",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Ticker",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Date",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Inception_Date",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Extracted_Title",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Present_In",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Players",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "Status",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "IST_Timestamp",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "store",
                "Target": "CST_Timestamp",
                "Value": "!csvLine",
                "Description": ""
              },
              {
                "Command": "csvSave",
                "Target": "${fileName}",
                "Value": "",
                "Description": "Write header"
              },
              {
                "Command": "store",
                "Target": "0",
                "Value": "playerIndex",
                "Description": "Start player loop"
