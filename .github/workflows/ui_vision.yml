name: Run UI.Vision TTM Crawler & Commit CSV

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Chrome & Virtual Display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable unzip curl
          pip install pandas

      - name: Download and Unpack UI.Vision Extension & HTML Runner
        run: |
          # 1. Download UI.Vision command-line runner
          curl -sSL "https://raw.githubusercontent.com/A9T9/RPA/master/ui.vision.html" -o ui.vision.html

          # 2. Download and extract the CRX using Python with Chrome User-Agent
          python3 - << 'EOF'
          import urllib.request
          import zipfile
          import io
          import os

          ext_id = "eipoliejnbbljnemmnflodfcggagbhcm"
          url = f"https://clients2.google.com/service/update2/crx?response=redirect&prodversion=128.0.0.0&acceptformat=crx2,crx3&x=id%3D{ext_id}%26uc"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          }

          print(f"Fetching CRX for extension: {ext_id}...")
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              data = resp.read()

          print(f"Downloaded {len(data)} bytes.")

          # Find ZIP magic header
          pk_idx = data.find(b'PK\x03\x04')
          if pk_idx == -1:
              print("Raw response preview:", data[:300])
              raise RuntimeError("Failed to locate ZIP header inside CRX package.")

          os.makedirs("uivision-extension", exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data[pk_idx:])) as z:
              z.extractall("uivision-extension")

          print("UI.Vision successfully unpacked into ./uivision-extension")
          EOF

      - name: Run Python Bridge & Browser under Virtual Display
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python run_pipeline.py

      - name: Commit and Push Generated Report CSV to Master
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add competitor_etf_report_*.csv
          
          if git diff --staged --quiet; then
            echo "No new report file generated to commit."
          else
            git commit -m "Auto-update competitor ETF extraction report [skip ci]"
            git push origin HEAD
          fi

      - name: Upload Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-etf-report
          path: competitor_etf_report_*.csv
