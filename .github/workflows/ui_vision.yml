
name: Install UI.Vision on Windows & Commit Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: windows-latest

    steps:

      - name: Commit and Push CSV
        shell: powershell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          $csvFile = "competitor-etf-report.csv"

          Write-Host "Checking CSV file..."

          if (-not (Test-Path $csvFile)) {
              Write-Error "ERROR: $csvFile was NOT generated!"
              exit 1
          }

          Write-Host "CSV found:"
          Get-Item $csvFile | Format-List Name, Length, FullName

          Write-Host "Git status before staging:"
          git status --short

          Write-Host "Adding files..."

          git add -f installation_status.txt
          git add -f competitor-etf-report.csv

          Write-Host "Staged files:"
          git diff --cached --name-status

          $stagedFiles = git diff --cached --name-only

          if ($stagedFiles -notcontains "competitor-etf-report.csv") {
              Write-Error "ERROR: competitor-etf-report.csv was NOT staged!"
              exit 1
          }

          Write-Host "CSV successfully staged."

          git commit -m "Update competitor ETF report [skip ci]"

          git push origin HEAD:master

          Write-Host "Push completed successfully."

      # IMPORTANT:
      # This is OUTSIDE the PowerShell run block

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-etf-report
          path: competitor-etf-report.csv
          if-no-files-found: warn
