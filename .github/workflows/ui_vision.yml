name: Install UI.Vision on Windows & Commit Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: windows-latest

    steps:
      # 1) Get the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Install UI.Vision (example: XModules / desktop app pattern)
      - name: Install UI.Vision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\uivision" | Out-Null
          $installer = "$env:USERPROFILE\uivision\uivision-setup.exe"

          # Replace with your real installer URL or commit the installer in the repo
          Invoke-WebRequest -Uri "https://YOUR_UIVISION_INSTALLER_URL/setup.exe" -OutFile $installer

          # Silent install flags depend on the installer you use
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

          "UI.Vision install attempted at $(Get-Date -Format o)" |
            Out-File -FilePath installation_status.txt -Encoding utf8

          Get-ChildItem "$env:USERPROFILE\uivision" | Format-Table Name, Length

      # 3) Run automation that CREATES the CSV
      - name: Run UI.Vision macro / generate report
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Example only — replace with your real CLI / browser extension command
          # & "C:\Path\To\UIVision\executable" -run "macros\competitor-etf.json" -csv "competitor-etf-report.csv"

          if (-not (Test-Path "competitor-etf-report.csv")) {
            Write-Error "competitor-etf-report.csv was not generated"
            exit 1
          }

          Write-Host "CSV generated:"
          Get-Item "competitor-etf-report.csv" | Format-List Name, Length, FullName

      # 4) Commit only if there is a real change
      - name: Commit and Push CSV
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f installation_status.txt competitor-etf-report.csv
          git status --short
          git diff --cached --stat

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
            exit 0
          }

          git commit -m "Update competitor ETF report [skip ci]"
          $branch = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($branch)) { $branch = "main" }
          git push origin "HEAD:$branch"

      # 5) Artifact for debugging
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-etf-report
          path: |
            competitor-etf-report.csv
            installation_status.txt
          if-no-files-found: warn
